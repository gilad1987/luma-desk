# Checks every pull request and every push to main, and deploys main to GitHub Pages (ADR 0004). A failed check stops
# the deploy. The Playwright parity suite runs here without its @screenshot tests: their baselines are recorded on
# macOS and would not match the Linux runner, so `npm run test:screenshots` stays a required local check.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# least privilege: only the deploy job may write to Pages
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # unit tests read the original page with `git show 48a3b63:index.html`, so the history must be there
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          # the Node version of local work (.nvmrc); it runs scripts/*.ts with built-in type stripping
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # the browser build belongs to the installed Playwright, so its version keys the browser cache
      - id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # the cache holds only the browser; the system libraries it needs must be installed on every runner
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e:ci
        env:
          # serve the dist/ that the build step made, so the suite checks what ships without a second build
          WEB_SERVER_CMD: npm run preview -- --host 127.0.0.1 --port 4173 --strictPort
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      # only main is published, a pull request is only checked; keep equal to the deploy job's condition
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    # equal to the upload step's condition in check: without that artifact there is nothing to deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # one deploy at a time; a running deploy is never cut off
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
